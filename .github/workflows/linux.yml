name: Linux

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libx11-dev libxtst-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Linux CLI
        run: cargo test --manifest-path linux/Cargo.toml --locked
