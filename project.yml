name: monitor
options:
  bundleIdPrefix: com.joeberg
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  monitor:
    type: application
    platform: macOS
    sources:
      - path: FrictionRecorder
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: CoreGraphics.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeberg.monitor
        PRODUCT_NAME: monitor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: NO
  MonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FrictionRecorderTests
    dependencies:
      - target: monitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeberg.monitorTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  monitor:
    build:
      targets:
        monitor: all
        MonitorTests: [test]
    test:
      environmentVariables:
        MONITOR_DISABLE_CAPTURE: "1"
      targets:
        - MonitorTests
